<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Review Report</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f0f4f8;
      font-family: 'Inter', sans-serif;
      padding: 36px 28px;
      color: #1e293b;
    }

    /* ── Header ── */
    .header { margin-bottom: 24px; }

    .header-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #3b82f6;
      flex-shrink: 0;
    }

    .label-text {
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .sheet-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.01em;
    }

    /* ── Card ── */
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(15,23,42,0.07), 0 1px 4px rgba(15,23,42,0.04);
    }

    /* ── Pre-header info bar ── */
    .info-bar {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 13px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
    }

    .info-item { display: flex; align-items: center; gap: 8px; }

    .info-key {
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .info-val {
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
    }

    /* ── Table wrapper ── */
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    /* ── Column headers ── */
    thead th {
      padding: 11px 20px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #64748b;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      border-right: 1px solid #e9eef4;
      white-space: nowrap;
    }

    thead th:last-child { border-right: none; }

    /* ── Body rows ── */
    tbody tr { transition: background 0.12s; cursor: default; }

    tbody tr.row-even      { background: #ffffff; }
    tbody tr.row-odd       { background: #f8fafc; }
    tbody tr.row-highlight { background: #fffbeb; }
    tbody tr.row-fail      { background: #fff5f5; }

    tbody tr.row-even:hover,
    tbody tr.row-odd:hover       { background: #eff6ff; }
    tbody tr.row-highlight:hover { background: #fef3c7; }
    tbody tr.row-fail:hover      { background: #fee2e2; }

    tbody td {
      padding: 12px 20px;
      font-size: 13px;
      border-bottom: 1px solid #f1f5f9;
      border-right: 1px solid #f1f5f9;
      color: #64748b;
    }

    tbody td:last-child { border-right: none; }

    /* cell roles */
    td.cell-key    { color: #475569; font-weight: 600; }
    td.cell-key-hl { color: #b45309; font-weight: 600; }
    td.cell-val    { color: #0f172a; font-weight: 500; }
    td.cell-empty  { color: #cbd5e1; }

    .hl-arrow { color: #d97706; font-size: 10px; margin-right: 5px; }

    /* ── Result badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge-pass {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .badge-fail {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .dash { color: #cbd5e1; }

    /* ── Footer ── */
    .footer {
      padding: 11px 24px;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-meta  { color: #94a3b8; font-size: 11px; }
    .footer-stats { display: flex; gap: 20px; }
    .footer-stat  { color: #64748b; font-size: 11px; font-weight: 500; }
    .stat-blue    { color: #2563eb; font-weight: 700; }
    .stat-amber   { color: #d97706; font-weight: 700; }
    .stat-red     { color: #dc2626; font-weight: 700; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">
    <div class="dot"></div>
    <span class="label-text">Review Report</span>
  </div>
  <div class="sheet-title" id="sheetTitle"></div>
</div>

<div class="card">
  <div class="info-bar"  id="infoBar"></div>
  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="footer">
    <span class="footer-meta" id="footerMeta"></span>
    <div class="footer-stats" id="footerStats"></div>
  </div>
</div>

<script>
  const sheetData = {
    sheets: [
      {
        name: "Q4KS95@T-RSMFAKUC-0090",
        Pre_header_rows: [
          { type: "normal", data: ["Chipset : ", "T-RSMFAKUC", "", "", "", ""] },
          { type: "normal", data: ["Model : ",   "Q4KS95",     "", "", "", ""] },
        ],
        columns: [
          "Review requisites",
          "Review details",
          "GMAP (size)",
          "Server (size)/contents",
          "From packages",
          "Result",
        ],
        Rows: [
          { type: "normal",    data: ["Version name : ",   "Q4KS95@T-RSMFAKUC-0090", "", "", "", "pass"] },
          { type: "normal",    data: ["Version number : ", "1296.8",                  "", "", "", "pass"] },
          { type: "normal",    data: ["EDID change : ",    "Yes",                     "", "", "", "pass"] },
          { type: "normal",    data: ["Otn only : ",       "N",                       "", "", "", "pass"] },
          { type: "normal",    data: ["Usb upgrade : ",    "Y",                       "", "", "", "pass"] },
          { type: "normal",    data: ["Build check : ",    "Failed",                  "", "", "", "not okay"] },
          { type: "Highlight", data: ["Otn only : ",       "N",                       "", "", "", "pass"] },
        ],
      },
    ],
  };

  function makeBadge(value) {
    if (!value) return '<span class="dash">—</span>';
    const isPass = value.toLowerCase() === "pass";
    const icon   = isPass ? "✓" : "✗";
    const cls    = isPass ? "badge badge-pass" : "badge badge-fail";
    return `<span class="${cls}">${icon} ${value}</span>`;
  }

  function render() {
    const sheet = sheetData.sheets[0];

    // Title
    document.getElementById("sheetTitle").textContent = sheet.name;

    // Info bar
    const infoBar = document.getElementById("infoBar");
    sheet.Pre_header_rows.forEach(row => {
      const key = row.data[0].replace(" : ", "");
      const val = row.data[1];
      infoBar.innerHTML += `
        <div class="info-item">
          <span class="info-key">${key}</span>
          <span class="info-val">${val}</span>
        </div>`;
    });

    // Table head
    const thead = document.getElementById("tableHead");
    const headerCells = sheet.columns.map(c => `<th>${c}</th>`).join("");
    thead.innerHTML = `<tr>${headerCells}</tr>`;

    // Table body
    const tbody = document.getElementById("tableBody");
    const lastIdx = sheet.columns.length - 1;

    sheet.Rows.forEach((row, rowIdx) => {
      const isHL   = row.type === "Highlight";
      const result = (row.data[lastIdx] || "").toLowerCase();
      const isFail = result === "not okay" || result === "fail";

      let rowClass;
      if (isHL)        rowClass = "row-highlight";
      else if (isFail) rowClass = "row-fail";
      else             rowClass = rowIdx % 2 === 0 ? "row-even" : "row-odd";

      const cells = row.data.map((cell, ci) => {
        // Last column → badge
        if (ci === lastIdx) {
          return `<td>${cell ? makeBadge(cell) : '<span class="dash">—</span>'}</td>`;
        }
        // Key column (index 0)
        if (ci === 0) {
          const cls = isHL ? "cell-key-hl" : "cell-key";
          const arrow = isHL ? '<span class="hl-arrow">▶</span>' : "";
          return `<td class="${cls}">${arrow}${cell}</td>`;
        }
        // Value column (index 1)
        if (ci === 1) {
          return `<td class="cell-val">${cell || '<span class="dash">—</span>'}</td>`;
        }
        // Empty middle columns
        return `<td class="cell-empty">${cell || "—"}</td>`;
      }).join("");

      tbody.innerHTML += `<tr class="${rowClass}">${cells}</tr>`;
    });

    // Footer
    const passCount = sheet.Rows.filter(r => r.data[lastIdx]?.toLowerCase() === "pass").length;
    const hlCount   = sheet.Rows.filter(r => r.type === "Highlight").length;
    const failCount = sheet.Rows.filter(r => ["not okay","fail"].includes(r.data[lastIdx]?.toLowerCase())).length;

    document.getElementById("footerMeta").textContent =
      `${sheet.Rows.length} rows · ${sheet.columns.length} columns`;

    document.getElementById("footerStats").innerHTML = `
      <span class="footer-stat"><span class="stat-blue">${passCount}</span> passed</span>
      ${failCount ? `<span class="footer-stat"><span class="stat-red">${failCount}</span> not okay</span>` : ""}
      <span class="footer-stat"><span class="stat-amber">${hlCount}</span> highlighted</span>`;
  }

  render();
</script>
</body>
</html>
